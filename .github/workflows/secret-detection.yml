name: Detección de claves secretas

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  secret-scan:
    name: Analizar claves secretas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Detectar posibles claves secretas
        run: python .github/scripts/detect_secrets.py
