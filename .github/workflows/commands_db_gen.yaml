name: Generación bases de datos

concurrency:
  group: commands-db-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'json/comandos/**'
      - 'json/distribuciones/**'
      - '.github/schemas/**'
      - '.github/scripts/validate_commands.py'
      - '.github/scripts/commands_db_gen.py'
      - '.github/scripts/distros_db_gen.py'
      - '.github/workflows/commands_db_gen.yaml'
  pull_request:
    paths:
      - 'json/comandos/**'
      - 'json/distribuciones/**'
      - '.github/schemas/**'
      - '.github/scripts/validate_commands.py'
      - '.github/scripts/commands_db_gen.py'
      - '.github/scripts/distros_db_gen.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar validador JSON Schema
        run: python -m pip install 'jsonschema>=4.18,<5'

      - name: Validar comandos y referencias
        run: python .github/scripts/validate_commands.py

      - name: Base de datos de comandos
        run: python .github/scripts/commands_db_gen.py

      - name: Base de datos de distribuciones
        run: python .github/scripts/distros_db_gen.py

      # Solo se publica desde main.
      - name: Guardar bases de datos en el repositorio
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/db/commands.json .github/db/distros.json
          if git diff --cached --quiet; then
            echo "Las bases de datos versionadas ya están actualizadas."
          else
            git commit -m "docs: actualización automática de bases de datos"
            git push || { git pull --rebase origin main && git push; }
          fi

      - name: Publicar Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES_JSON=$(gh release list --limit 100 --json tagName,name)
          OLD_TITLE=$(printf '%s' "$RELEASES_JSON" | jq -r '[.[] | select(.tagName == "latest")][0].name // empty')

          if [ -z "$OLD_TITLE" ]; then
            NEW_VER="V-A.0.1"
          elif [[ "$OLD_TITLE" =~ V-([A-Z])\.([0-9]+)\.([0-9]+) ]]; then
            LETRA="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH=$((10#${BASH_REMATCH[3]} + 1))
            NEW_VER="V-${LETRA}.${MINOR}.${PATCH}"
          else
            echo "[ERROR] No se pudo extraer la versión del release anterior: $OLD_TITLE" >&2
            exit 1
          fi

          FECHA_HORA=$(date +'%d-%m-%Y')
          TITULO_RELEASE="BDD JSON ${NEW_VER}/${FECHA_HORA}"
          gh release delete latest --cleanup-tag -y || true
          gh release create latest .github/db/commands.json .github/db/distros.json \
            --title "$TITULO_RELEASE" \
            --notes "Archivos JSON compilados automáticamente."
