name: Generación bases de datos

on:
  push:
    paths:
      - 'comandos/**'
      - 'servicios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Base de datos de comandos
        run: python .github/scripts/commands_db_gen.py

      - name: Base de datos de servicios
        run: python .github/scripts/services_db_gen.py

      - name: Commit y publicar
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: actualización automática de bases de datos"
          file_pattern: '.github/db/*.json'