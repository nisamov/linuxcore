name: Generar base de datos para monolineas

on:
  push:
    paths:
      - 'comandos/monolínea/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate JSON
        run: python .github/scripts/monolinea_db_gen.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/db/monolinea.json
          git diff --staged --quiet || git commit -m "Actualización monolinea.json"
          git push